<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NYPA Analytics Chatbot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --text-dim: #9aa1ad;
    --accent: #4f8cff;
    --accent-2: #2ecc8f;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--text-dim); font-size: 12px; }
  #role-badge {
    font-size: 11px; padding: 3px 8px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
  }
  #logout-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; margin-left: 8px;
  }

  #login-screen {
    flex: 1; display: flex; align-items: center; justify-content: center;
  }
  #login-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px; width: 320px;
  }
  #login-box h2 { margin: 0 0 4px; font-size: 18px; }
  #login-box p { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; }
  #login-box input {
    width: 100%; padding: 10px 12px; margin-bottom: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 14px;
  }
  #login-box button {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: var(--accent); color: white; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  #login-error { color: var(--error); font-size: 13px; margin-top: 8px; min-height: 16px; }
  .demo-hint { color: var(--text-dim); font-size: 11px; margin-top: 16px; line-height: 1.5; }

  #chat-screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 720px; }
  .msg.user { align-self: flex-end; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5;
  }
  .msg.user .bubble { background: var(--accent); color: white; }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--border); }
  .msg.bot .bubble.error { border-color: var(--error); color: var(--error); }
  .meta { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  details.sql-block {
    margin-top: 8px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px;
  }
  details.sql-block summary { cursor: pointer; color: var(--accent); }
  details.sql-block pre { white-space: pre-wrap; margin: 8px 0 0; color: var(--text-dim); }
  table.result-table {
    margin-top: 8px; border-collapse: collapse; font-size: 12px; width: 100%;
  }
  table.result-table th, table.result-table td {
    border: 1px solid var(--border); padding: 4px 8px; text-align: left;
  }
  table.result-table th { background: var(--panel-2); }

  #input-bar {
    display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border);
  }
  #question-input {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px;
  }
  #send-btn {
    padding: 0 20px; border-radius: 10px; border: none; background: var(--accent);
    color: white; font-weight: 600; cursor: pointer;
  }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 12px; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 14px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h2>NYPA Analytics Chatbot</h2>
    <p>Ask questions about NYPA generation and supply-rate data.</p>
    <input id="username" placeholder="Username" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="login-btn">Sign in</button>
    <div id="login-error"></div>
    <div class="demo-hint">
      Demo accounts: <code>admin</code>, <code>gov_analyst</code>, <code>biz_analyst</code><br/>
      Password = <code>&lt;username&gt;-demo123</code>
    </div>
  </div>
</div>

<div id="chat-screen">
  <header>
    <div>
      <h1>NYPA Analytics Chatbot</h1>
      <div class="sub">Natural-language questions over the NYPA gold data model</div>
    </div>
    <div>
      <span id="role-badge"></span>
      <button id="logout-btn">Sign out</button>
    </div>
  </header>
  <div id="messages"></div>
  <div id="chips"></div>
  <div id="input-bar">
    <input id="question-input" placeholder="Ask a question about generation or supply rates..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
let token = null;
let role = null;
let sessionId = null;

const loginScreen = document.getElementById('login-screen');
const chatScreen = document.getElementById('chat-screen');
const messagesEl = document.getElementById('messages');
const chipsEl = document.getElementById('chips');

const STARTER_QUESTIONS = [
  "Which facility generated the most electricity in 2023?",
  "What is the average energy price for governmental customers?",
  "Compare average demand price between governmental and business customers",
  "Show net generation by year for NIAGARA",
];

function renderChips() {
  chipsEl.innerHTML = '';
  STARTER_QUESTIONS.forEach(q => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = q;
    chip.onclick = () => { document.getElementById('question-input').value = q; sendMessage(); };
    chipsEl.appendChild(chip);
  });
}

document.getElementById('login-btn').onclick = async () => {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try {
    const resp = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.detail || 'Login failed');
    }
    const data = await resp.json();
    token = data.token;
    role = data.role;
    document.getElementById('role-badge').textContent = role;
    loginScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    renderChips();
  } catch (e) {
    errEl.textContent = e.message;
  }
};

document.getElementById('logout-btn').onclick = () => {
  token = null; role = null; sessionId = null;
  messagesEl.innerHTML = '';
  chatScreen.style.display = 'none';
  loginScreen.style.display = 'flex';
};

function addMessage(role, html) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  wrap.innerHTML = html;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderTable(columns, rows) {
  if (!columns.length) return '';
  let html = '<table class="result-table"><thead><tr>';
  columns.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
  html += '</tr></thead><tbody>';
  rows.slice(0, 50).forEach(r => {
    html += '<tr>' + r.map(v => `<td>${escapeHtml(String(v))}</td>`).join('') + '</tr>';
  });
  html += '</tbody></table>';
  if (rows.length > 50) html += `<div class="meta">Showing 50 of ${rows.length} rows</div>`;
  return html;
}

async function sendMessage() {
  const input = document.getElementById('question-input');
  const question = input.value.trim();
  if (!question) return;
  input.value = '';

  addMessage('user', `<div class="bubble">${escapeHtml(question)}</div>`);
  const pending = addMessage('bot', `<div class="bubble">Thinking…</div>`);

  try {
    const resp = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ question, session_id: sessionId }),
    });
    const data = await resp.json().catch(() => ({}));

    if (!resp.ok) {
      pending.innerHTML = `<div class="bubble error">${escapeHtml(data.detail || 'Something went wrong.')}</div>`;
      return;
    }

    sessionId = data.session_id;
    let html = `<div class="bubble">${escapeHtml(data.answer)}</div>`;
    if (data.domains && data.domains.length) {
      html += `<div class="meta">Domains: ${data.domains.join(', ')} · ${data.duration_ms || 0}ms · ${data.row_count || 0} rows</div>`;
    }
    if (data.sql) {
      html += `<details class="sql-block"><summary>View generated SQL</summary><pre>${escapeHtml(data.sql)}</pre>${renderTable(data.columns, data.rows)}</details>`;
    }
    pending.innerHTML = html;
  } catch (e) {
    pending.innerHTML = `<div class="bubble error">Network error: ${escapeHtml(e.message)}</div>`;
  }
}

document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('question-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
